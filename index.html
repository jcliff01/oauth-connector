<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Genesys Cloud API Console</title>
  <link rel="stylesheet" href="./console.css">
  <script type="module" src="./console.js"></script>
</head>
<body>
  <main>
    <header><h1>Genesys Cloud API Console</h1><nav aria-label="Related tools"><a href="./troubleshooting.html">Troubleshooting APIs</a> · <a href="https://developer.genesys.cloud/devapps/api-explorer" target="_blank" rel="noopener noreferrer">API Explorer ↗</a></nav></header>
    <section aria-labelledby="connection-heading">
      <h2 id="connection-heading">Connection</h2>
      <form id="connect">
        <div class="connection-fields">
          <label>Token name<input id="token-name" maxlength="80" placeholder="Genesys Cloud"></label>
          <label>Grant type<select id="grant">
            <option value="pkce">Authorization Code with PKCE</option>
            <option id="credentials-grant" value="credentials" disabled>Client Credentials (requires Node.js)</option>
            <option id="code-grant" value="code" disabled>Authorization Code (requires Node.js)</option>
          </select></label>
          <label>Access token URL<input id="token-url" type="url" list="token-urls" placeholder="https://login.mypurecloud.com/oauth/token" required spellcheck="false"></label>
          <datalist id="token-urls"></datalist>
          <label>Client ID<input id="client" required spellcheck="false" autocomplete="off"></label>
          <label>Client secret<input id="secret" type="password" autocomplete="off" disabled></label>
        </div>
        <label id="scope-field" hidden>Scope (optional)<input id="scope" placeholder="Space-separated scopes" disabled></label>
        <p id="grant-help"></p>
        <div class="actions">
          <button id="sign-in">Connect to Genesys Cloud</button>
          <button type="button" id="verify" disabled>Verify connection</button>
          <button type="button" id="disconnect" disabled>Disconnect</button>
        </div>
      </form>
      <p id="status" role="status">Disconnected</p>
    </section>
    <section aria-labelledby="request-heading">
      <h2 id="request-heading">API request</h2>
      <form id="request">
        <div class="request-line">
          <label>Method<select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></label>
          <label>Platform API path<input id="path" value="/api/v2/users/me" required spellcheck="false" aria-describedby="path-help"></label>
        </div>
        <p id="path-help">Copy the path from API Explorer. Replace path parameters and append any query string.</p>
        <label id="body-field">Message body (optional)<textarea id="body" disabled aria-describedby="body-help" rows="5" spellcheck="false" placeholder='{"name": "Example"}'></textarea></label>
        <p id="body-help">Select POST, PUT, PATCH, or DELETE to include a JSON body.</p>
        <div class="actions"><button id="send" disabled>Send request</button></div>
      </form>
    </section>
    <section aria-labelledby="response-heading">
      <h2 id="response-heading">Response</h2>
      <p id="response-status" role="status">Waiting for a request</p>
      <pre id="output" tabindex="0" aria-label="HTTP response body"></pre>
    </section>
  </main>
</body>
</html>

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        shell: bash
        run: for f in *.js; do node --check "$f"; done
      - name: Start the console and load its page
        shell: bash
        run: |
          npm start &
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/oauth/code && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8080/
